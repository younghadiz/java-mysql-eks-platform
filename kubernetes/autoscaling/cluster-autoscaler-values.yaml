---
cloudProvider: aws
awsRegion: ca-central-1

autoDiscovery:
  clusterName: java-mysql-eks

rbac:
  create: true

  serviceAccount:
    # The ServiceAccount was created by eksctl with an IRSA role.
    create: false
    name: cluster-autoscaler

replicaCount: 1

image:
  repository: registry.k8s.io/autoscaling/cluster-autoscaler

  # Cluster Autoscaler major/minor should match the EKS
  # Kubernetes major/minor version.
  #
  # EKS Kubernetes: 1.34
  # Cluster Autoscaler: 1.34
  tag: v1.34.3

  pullPolicy: IfNotPresent

extraArgs:
  v: 4
  stderrthreshold: info
  skip-nodes-with-local-storage: false
  expander: least-waste
  balance-similar-node-groups: true
  skip-nodes-with-system-pods: false

nodeSelector:
  workload-type: ec2

priorityClassName: system-cluster-critical

podAnnotations:
  cluster-autoscaler.kubernetes.io/safe-to-evict: "false"

resources:
  requests:
    cpu: 100m
    memory: 300Mi

  limits:
    cpu: 500m
    memory: 600Mi

securityContext:
  runAsNonRoot: true
  runAsUser: 65534
  runAsGroup: 65534

  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true

  capabilities:
    drop:
      - ALL 
