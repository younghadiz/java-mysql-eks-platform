---
apiVersion: apps/v1
kind: Deployment

metadata:
  name: java-app
  namespace: java-app
  labels:
    app.kubernetes.io/name: java-app
    app.kubernetes.io/component: application
    app.kubernetes.io/part-of: java-mysql-eks-platform

spec:
  replicas: 3

  revisionHistoryLimit: 5

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1

  selector:
    matchLabels:
      app.kubernetes.io/name: java-app

  template:
    metadata:
      labels:
        app.kubernetes.io/name: java-app
        app.kubernetes.io/component: application
        app.kubernetes.io/part-of: java-mysql-eks-platform
        compute-type: fargate

    spec:
      terminationGracePeriodSeconds: 30

      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: java-app
          image: "${ECR_REPOSITORY_URL}:${IMAGE_TAG}"
          imagePullPolicy: Always

          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

          envFrom:
            - configMapRef:
                name: java-app-config

            - secretRef:
                name: java-app-secret

          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1Gi

          startupProbe:
            tcpSocket:
              port: http
            failureThreshold: 30
            periodSeconds: 5
            timeoutSeconds: 2

          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3

          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          volumeMounts:
            - name: temporary-storage
              mountPath: /tmp

      volumes:
        - name: temporary-storage
          emptyDir: {}
